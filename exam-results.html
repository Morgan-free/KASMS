<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KASMS | Exam Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="portal-page">
    <header class="portal-header">
      <div class="container portal-topbar">
        <div class="brand">
          <div class="brand-mark">K</div>
          <div>
            <span class="brand-name">KASMS</span>
            <small>Results</small>
          </div>
        </div>
        <div class="portal-actions">
          <a href="teacher-login.html" class="btn btn-secondary small-btn"
            >Teacher Login</a
          >
        </div>
      </div>
    </header>

    <main class="portal-main container">
      <section class="portal-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow accent">Academic Records</p>
            <h2>Exam Results Management</h2>
          </div>
          <button class="btn btn-primary small-btn">Add Result</button>
        </div>

        <div class="results-table-wrap">
          <table class="results-table">
            <thead>
              <tr>
                <th>Student</th>
                <th>Course</th>
                <th>Term</th>
                <th>Score</th>
                <th>Grade</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Sarah Johnson</td>
                <td>Clinical Medicine</td>
                <td>1st Term</td>
                <td>92</td>
                <td>A</td>
              </tr>
              <tr>
                <td>Grace Smith</td>
                <td>Nursing</td>
                <td>1st Term</td>
                <td>88</td>
                <td>A</td>
              </tr>
              <tr>
                <td>Daniel Brown</td>
                <td>Clinical Medicine</td>
                <td>2nd Term</td>
                <td>76</td>
                <td>B</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
