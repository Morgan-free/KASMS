<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KASMS | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-mark">K</div>
          <div>
            <span class="brand-name">KASMS</span>
            <small>Portal</small>
          </div>
        </div>

        <div class="auth-header">
          <p class="eyebrow accent">Student Portal</p>
          <h2>Login</h2>
        </div>

        <form id="loginForm" class="auth-form">
          <label>
            Role
            <select id="roleSelect">
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
            </select>
          </label>

          <label>
            Full name / Staff name
            <input
              id="nameInput"
              type="text"
              placeholder="Enter your name"
              required
            />
          </label>

          <label>
            Password
            <input
              id="passwordInput"
              type="password"
              placeholder="Enter password"
              required
            />
          </label>

          <div class="hint-row">
            <span>Student password: <strong>student123</strong></span>
            <span>Teacher password: <strong>teacher123</strong></span>
          </div>

          <button type="submit" class="btn btn-primary full-width">
            Sign In
          </button>
          <p id="loginMessage" class="form-message" aria-live="polite"></p>
        </form>

        <div class="auth-footer">
          <a href="index.html">Back to homepage</a>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
